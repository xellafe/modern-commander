[package]
name = "modern-commander"
version = "0.1.0"
description = "File manager per Windows in stile Total Commander"
authors = ["Federico Xella"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modern_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
trash = "5.2.9"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Foundation", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Registry", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_NetworkManagement_NetManagement", "Win32_Security_Credentials"] }
uuid = { version = "1.28.0", features = ["v4"] }
getrandom = "0.4.3"
encoding_rs = "0.8.42"
zip = { version = "9.0.5", default-features = false }
flate2 = "1.1.10"
sevenz-rust2 = { version = "0.24.1", default-features = false }
portable-pty = "0.9.0"
ssh2 = "0.9.6"
base64 = "0.23.1"
libssh2-sys = "0.3.3"
suppaftp = { version = "12.2.1", features = ["deprecated", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "compress"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"

[features]
# Agganci per i test d'integrazione dell'helper elevato (MC_TEST_SERVER_EXE, MC_HELPER_IDLE_MS,
# --test-pipe-server): mai nelle build distribuite.
test-hooks = []

# `cargo test --manifest-path src-tauri/Cargo.toml --features test-hooks`
[[test]]
name = "elevation_pipe"
required-features = ["test-hooks"]
